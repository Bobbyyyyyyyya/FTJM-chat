name: Release Platform

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      runner:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create env file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ENC_KEY: ${{ secrets.VITE_ENCRYPTION_KEY }}
          LEGACY_ENC_KEY: ${{ secrets.VITE_LEGACY_ENCRYPTION_KEY }}
          IMGBB_KEY: ${{ secrets.VITE_IMGBB_API_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=$SUPABASE_URL" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_KEY" >> .env.local
          echo "VITE_ENCRYPTION_KEY=$ENC_KEY" >> .env.local
          echo "VITE_LEGACY_ENCRYPTION_KEY=$LEGACY_ENC_KEY" >> .env.local
          echo "VITE_IMGBB_API_KEY=$IMGBB_KEY" >> .env.local
          cp .env.local packages/web/.env.local

      - name: Install Linux build tools
        if: inputs.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot libfuse2

      - name: Build
        run: npm run build

      - name: Remove stale assets for this platform
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found, skipping cleanup"
            exit 0
          fi
          case "${{ inputs.platform }}" in
            mac)   PAT='\.(dmg|zip)$' ;;
            win)   PAT='\.exe$' ;;
            linux) PAT='\.(deb|AppImage)$' ;;
          esac
          names="$(gh release view "$TAG" --json assets --jq '.[].name' 2>/dev/null | grep -E "$PAT" || true)"
          if [ -z "$names" ]; then
            echo "No stale assets to remove"
            exit 0
          fi
          echo "$names" | while IFS= read -r name; do
            [ -n "$name" ] && echo "deleting $name" && gh release delete-asset "$TAG" "$name" --yes || true
          done

      - name: Import macOS signing cert
        if: inputs.platform == 'mac'
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "$CSC_LINK" | base64 --decode > /tmp/cert.p12
            security create-keychain -p temp temp.keychain
            security default-keychain -s temp.keychain
            security unlock-keychain -p temp temp.keychain
            security import /tmp/cert.p12 -k temp.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp temp.keychain
          else
            echo "No signing cert, skipping"
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Package
        shell: bash
        run: cd packages/main && npx electron-builder --${{ inputs.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            packages/main/release/*.dmg
            packages/main/release/*.zip
            packages/main/release/*.AppImage
            packages/main/release/*.deb
            packages/main/release/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}