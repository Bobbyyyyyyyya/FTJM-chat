name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Create env file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ENC_KEY: ${{ secrets.VITE_ENCRYPTION_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=$SUPABASE_URL" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_KEY" >> .env.local
          echo "VITE_ENCRYPTION_KEY=$ENC_KEY" >> .env.local
          cp .env.local packages/web/.env.local

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot libfuse2

      - name: Build
        run: pnpm build

      - name: Import macOS signing cert
        if: matrix.platform == 'mac'
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "$CSC_LINK" | base64 --decode > /tmp/cert.p12
            security create-keychain -p temp temp.keychain
            security default-keychain -s temp.keychain
            security unlock-keychain -p temp temp.keychain
            security import /tmp/cert.p12 -k temp.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp temp.keychain
          else
            echo "No signing cert, skipping"
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Package
        shell: bash
        run: cd packages/main && npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/main/release/*.dmg
            packages/main/release/*.zip
            packages/main/release/*.AppImage
            packages/main/release/*.deb
            packages/main/release/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
