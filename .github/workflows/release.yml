name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload artifacts to (defaults to pushed tag)'
        required: false
        default: ''
      os:
        description: 'Which platform(s) to build'
        type: choice
        options:
          - all
          - mac
          - win
          - linux
        default: all

permissions:
  contents: write

jobs:
  mac:
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'mac'
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: mac
      runner: macos-latest
      tag: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  win:
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'win'
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: win
      runner: windows-latest
      tag: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'linux'
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: linux
      runner: ubuntu-latest
      tag: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
    secrets: inherit